<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="230" viewBox="0 0 1360 230" role="img" aria-labelledby="title desc">
  <title id="title">Virtual ECG system architecture</title>
  <desc id="desc">MIT-BIH to WFDB to real-time replay to filtering to R-peak detection to RR and BPM to Flask JSON to Cardia browser.</desc>
  <rect width="1360" height="230" fill="#f8fafc"/>
  <text x="32" y="42" fill="#172235" font-family="Arial,sans-serif" font-size="23" font-weight="700">Cardia virtual ECG: signal and monitoring path</text>
  <text x="32" y="66" fill="#526278" font-family="Arial,sans-serif" font-size="14">MIT-BIH records 100 / 118 · WFDB physical ECG · local Python processing · browser display</text>
  <g fill="#fff" stroke="#456778" stroke-width="2">
    <rect x="24" y="101" width="128" height="78" rx="10"/><rect x="185" y="101" width="118" height="78" rx="10"/>
    <rect x="336" y="101" width="137" height="78" rx="10"/><rect x="506" y="101" width="126" height="78" rx="10"/>
    <rect x="665" y="101" width="133" height="78" rx="10"/><rect x="831" y="101" width="122" height="78" rx="10"/>
    <rect x="986" y="101" width="125" height="78" rx="10"/><rect x="1144" y="101" width="185" height="78" rx="10"/>
  </g>
  <g fill="#172235" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">
    <text x="88" y="145">MIT-BIH</text><text x="244" y="145">WFDB</text>
    <text x="404" y="135"><tspan x="404">real-time</tspan><tspan x="404" dy="19">replay</tspan></text>
    <text x="569" y="145">filtering</text><text x="731" y="135"><tspan x="731">R-peak</tspan><tspan x="731" dy="19">detection</tspan></text>
    <text x="892" y="145">RR / BPM</text><text x="1048" y="135"><tspan x="1048">Flask</tspan><tspan x="1048" dy="19">JSON</tspan></text>
    <text x="1236" y="135"><tspan x="1236">Cardia</tspan><tspan x="1236" dy="19">browser</tspan></text>
  </g>
  <g stroke="#168d88" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M153 140h25"/><path d="M304 140h25"/><path d="M474 140h25"/><path d="M633 140h25"/>
    <path d="M799 140h25"/><path d="M954 140h25"/><path d="M1112 140h25"/>
  </g>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l8 4-8 4z" fill="#168d88"/></marker></defs>
